<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>StudyLens | 로그인</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Pretendard", "Noto Sans KR", sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 360px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .login-box h1 {
            margin: 0 0 10px;
            font-size: 26px;
            text-align: center;
            color: #111827;
        }

        .login-box p {
            margin-bottom: 30px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }

        .login-box input:focus {
            outline: none;
            border-color: #6366f1;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #4338ca;
        }

        .error {
            margin-top: 15px;
            color: #dc2626;
            font-size: 13px;
            text-align: center;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>StudyLens</h1>
    <p>공부 기록을 시작하세요</p>

    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="아이디" required>
        <input type="password" name="password" placeholder="비밀번호" required>
        <button type="submit">로그인</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <div class="footer">
        © 2025 StudyLens
    </div>
</div>

</body>
</html>
