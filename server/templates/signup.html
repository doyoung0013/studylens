<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StudyLens | 회원가입</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Pretendard", "Noto Sans KR", sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            width: 360px;
            max-width: calc(100vw - 32px);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .login-box h1 {
            margin: 0 0 10px;
            font-size: 26px;
            text-align: center;
            color: #111827;
        }

        .login-box p {
            margin-bottom: 30px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }

        .login-box input:focus {
            outline: none;
            border-color: #6366f1;
        }

        .login-box button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #4338ca;
        }

        .error {
            margin-top: 15px;
            color: #dc2626;
            font-size: 13px;
            text-align: center;
        }

        .switch {
            margin-top: 18px;
            text-align: center;
            font-size: 13px;
            color: #6b7280;
        }

        .switch a {
            color: #4f46e5;
            font-weight: 600;
            text-decoration: none;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>StudyLens</h1>
    <p>계정을 만들고 친구와 함께 공부해 보세요</p>

    <form method="post">
        {% csrf_token %}
        <input type="text" name="username" placeholder="아이디 (영문·숫자·_ . 4~20자)" value="{{ username|default:'' }}" required>
        <input type="password" name="password" placeholder="비밀번호 (8자 이상)" required>
        <input type="password" name="password2" placeholder="비밀번호 확인" required>
        <button type="submit">가입하기</button>
    </form>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <div class="switch">
        이미 계정이 있나요? <a href="{% url 'login' %}">로그인</a>
    </div>

    <div class="footer">
        © StudyLens
    </div>
</div>

</body>
</html>
