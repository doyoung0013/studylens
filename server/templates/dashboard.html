<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>StudyLens | 대시보드</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Pretendard", "Noto Sans KR", sans-serif;
        }

        body {
            margin: 0;
            background: #f3f4f6;
        }

        header {
            background: #4f46e5;
            padding: 20px 40px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
        }

        header span {
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            padding: 40px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin: 0 0 10px;
            font-size: 16px;
            color: #374151;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
            color: #111827;
            margin: 0;
        }

        .section {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }

        .section h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 18px;
            color: #111827;
        }

        .placeholder {
            color: #9ca3af;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>StudyLens Dashboard</h1>
    <span>{{ request.user.username }} 님</span>
</header>

<div class="container">

    <div class="cards">
        <div class="card">
            <h3>오늘 공부 시간</h3>
            <p>{{ today_minutes }} 분</p>
        </div>

        <div class="card">
            <h3>최근 7일 총 공부 시간</h3>
            <p>{{ week_hours }} 시간</p>
        </div>

        <div class="card">
            <h3>오늘 촬영된 이미지</h3>
            <p>{{ image_count }} 장</p>
        </div>
    </div>


    <div class="section">
    <h2>공부 이미지 갤러리</h2>

    {% if images %}
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px;">
            {% for img in images %}
                <img src="{{ img.image.url }}"
                     style="width: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
            {% endfor %}
        </div>
    {% else %}
        <div class="placeholder">
            오늘 촬영된 공부 이미지가 없습니다.
        </div>
    {% endif %}
</div>


</div>

</body>
</html>
